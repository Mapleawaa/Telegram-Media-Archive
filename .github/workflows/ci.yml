name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: typecheck / lint / test / smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        # 版本取自 package.json 的 packageManager 字段（pnpm@12.6.0）

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 类型检查（三包）
        run: pnpm typecheck

      - name: Lint（oxlint，0 警告门禁）
        run: pnpm lint

      - name: 单元测试
        run: pnpm -r test

      # 端到端冒烟：临时库 + mock AI，自包含无需任何外部服务
      - name: 端到端冒烟
        run: pnpm -F @tma/core smoke
